name: Release
# Push a tag v1.2.3 (matching src/horus/_version.py) to publish horus-sdk to PyPI
# via trusted publishing (no stored token) plus a GitHub build attestation.
on:
  push: { tags: ["v*"] }
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install build -e . pytest pytest-asyncio respx && pytest -q
      - name: Version matches tag
        run: test "v$(python -c 'import horus; print(horus.__version__)')" = "$GITHUB_REF_NAME"
      - run: python -m build
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*" }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
