[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "horus-sdk"
dynamic = ["version"]
description = "Official Python SDK for the Horus API (horusship.com)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Horus", email = "support@horusship.com" }]
keywords = ["horus", "ebay", "amazon", "arbitrage", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1",
    "pydantic>=2.5,<3",
    "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://horusship.com"
Documentation = "https://horusship.com/api/v1/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "datamodel-code-generator[http]>=0.90",
]

[tool.hatch.version]
path = "src/horus/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/horus"]

[tool.hatch.build.targets.sdist]
include = ["src/horus", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: read-only smoke test against the real API (needs HORUS_LIVE_API_KEY)"]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/horus", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["horus.types._models"]
# Generated from the OpenAPI spec. Event subclasses narrow `data: dict` to a typed model
# (the spec's allOf), which mypy reports as an incompatible override.
disable_error_code = ["assignment"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["src/horus/types/_models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
